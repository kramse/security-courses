<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 255" font-family="Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <style>
      .b{stroke:#000;stroke-width:1.5}
      .l{stroke:#000;stroke-width:1.8;fill:none;marker-end:url(#a)}
      .m{font-family:"DejaVu Sans Mono", Courier, monospace}
    </style>
  </defs>

  <text x="470" y="20" text-anchor="middle" font-size="12" font-weight="bold">stored in database</text>

  <!-- User 1 -->
  <rect class="b" x="10" y="30" width="145" height="30" rx="4" fill="#e8ebfb"/>
  <text x="18" y="50">password: <tspan class="m">hunter2</tspan></text>
  <rect class="b" x="35" y="68" width="120" height="30" rx="4" fill="#fde0c2"/>
  <text x="43" y="88">salt: <tspan class="m">x9Kq3</tspan></text>
  <rect class="b" x="205" y="42" width="120" height="44" rx="4" fill="#ececec"/>
  <text x="265" y="60" text-anchor="middle">slow hash</text>
  <text x="265" y="77" text-anchor="middle" font-size="11">bcrypt / Argon2</text>
  <path class="l" d="M155,45 H203"/>
  <path class="l" d="M155,83 H203"/>
  <rect class="b" x="365" y="49" width="210" height="30" rx="4" fill="#dcf5dc"/>
  <text x="470" y="69" text-anchor="middle" class="m">x9Kq3 : 5e8f...a21c</text>
  <path class="l" d="M325,64 H363"/>

  <!-- User 2 -->
  <rect class="b" x="10" y="140" width="145" height="30" rx="4" fill="#e8ebfb"/>
  <text x="18" y="160">password: <tspan class="m">hunter2</tspan></text>
  <rect class="b" x="35" y="178" width="120" height="30" rx="4" fill="#fde0c2"/>
  <text x="43" y="198">salt: <tspan class="m">T7mZa</tspan></text>
  <rect class="b" x="205" y="152" width="120" height="44" rx="4" fill="#ececec"/>
  <text x="265" y="170" text-anchor="middle">slow hash</text>
  <text x="265" y="187" text-anchor="middle" font-size="11">bcrypt / Argon2</text>
  <path class="l" d="M155,155 H203"/>
  <path class="l" d="M155,193 H203"/>
  <rect class="b" x="365" y="159" width="210" height="30" rx="4" fill="#dcf5dc"/>
  <text x="470" y="179" text-anchor="middle" class="m">T7mZa : c03b...9d47</text>
  <path class="l" d="M325,174 H363"/>

  <text x="470" y="225" text-anchor="middle" font-size="12">same password, different salt</text>
  <text x="470" y="243" text-anchor="middle" font-size="12">= different hash</text>
</svg>
