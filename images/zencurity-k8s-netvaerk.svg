<svg width="700" height="520" viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Kubernetes setup med netværkspolitik og VPN-adgang</title>
<desc>VPN-klienter går gennem vpn01 (WireGuard) ind til en Cilium Gateway med VPN-begrænset netværkspolitik. Samtidig annoncerer Cilium BGP LoadBalancer-IP'er via en Arista-switch. Begge veje leder ind i namespace zencurity-intranet, som kører Nextcloud AIO og Wiki.js på klyngen cheese01/cheese02.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="30" y="30" width="220" height="56" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="140" y="54" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#4A1B0C">VPN-klienter</text>
<text x="140" y="72" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993C1D">Eksterne brugere / hjemmenet</text>

<rect x="450" y="30" width="220" height="56" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="560" y="54" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#4A1B0C">Arista router</text>
<text x="560" y="72" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993C1D">BGP peer for LB-annoncering</text>

<line x1="140" y1="86" x2="140" y2="125" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="560" y1="86" x2="560" y2="125" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="30" y="130" width="220" height="60" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
<text x="140" y="154" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#042C53">vpn01 (OpenBSD)</text>
<text x="140" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">WireGuard VPN-server</text>

<rect x="440" y="130" width="230" height="60" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
<text x="555" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#042C53">Cilium BGP</text>
<text x="555" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">LB-IP 185.129.62.181</text>
<text x="555" y="182" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">2a06:d380:0:9985::100</text>

<line x1="140" y1="190" x2="230" y2="235" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="555" y1="190" x2="470" y2="235" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="40" y="220" width="620" height="270" rx="20" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="60" y="248" font-family="sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Kubernetes-klynge — cheese01 / cheese02</text>
<text x="60" y="266" font-family="sans-serif" font-size="12" fill="#5F5E5A">v1.36, Cilium 1.18.4, KVM-VM'er på gouda01</text>

<rect x="100" y="230" width="480" height="60" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="340" y="256" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#26215C">Cilium Gateway — intranet-gateway</text>
<text x="340" y="274" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3C3489">Network policy: kun VPN-begrænset trafik tilladt</text>

<rect x="100" y="330" width="480" height="130" rx="14" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="120" y="356" font-family="sans-serif" font-size="13" font-weight="600" fill="#04342C">namespace: zencurity-intranet</text>

<rect x="130" y="380" width="200" height="60" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/>
<text x="230" y="404" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#085041">Nextcloud AIO</text>
<text x="230" y="422" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0F6E56">cloud.zencurity.com</text>

<rect x="350" y="380" width="200" height="60" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/>
<text x="450" y="404" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#085041">Wiki.js</text>
<text x="450" y="422" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0F6E56">wiki.zencurity.com</text>

<line x1="280" y1="290" x2="230" y2="378" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="400" y1="290" x2="450" y2="378" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<text x="60" y="480" font-family="sans-serif" font-size="11" fill="#888780">TLS via cert-manager + Let's Encrypt (HTTP-01), per-hostname certificates</text>
</svg>
