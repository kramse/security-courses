<svg width="700" height="460" viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Oversigt over selvhostede services i Zencurity</title>
<desc>Central boks "Zencurity self-hosted stack" forgrener sig til fire kategorier: netværk (egen LIR og DNS), mail (Postfix og Dovecot), web (NGINX og Kubernetes), og interne værktøjer (Git, Nextcloud, Wiki.js, PostgreSQL, LibreNMS, NIPAP).</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="260" y="30" width="180" height="56" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="350" y="54" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">Zencurity</text>
<text x="350" y="72" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">self-hosted stack</text>

<line x1="300" y1="86" x2="120" y2="138" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="330" y1="86" x2="295" y2="138" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="370" y1="86" x2="445" y2="138" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="400" y1="86" x2="605" y2="138" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="30" y="140" width="180" height="120" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
<text x="120" y="164" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#042C53">Netværk</text>
<text x="45" y="188" font-family="sans-serif" font-size="11" fill="#0C447C">Egen LIR (RIPE NCC)</text>
<text x="45" y="206" font-family="sans-serif" font-size="11" fill="#0C447C">/22 IPv4 + /29 IPv6</text>
<text x="45" y="224" font-family="sans-serif" font-size="11" fill="#0C447C">Autoritativ DNS</text>
<text x="45" y="242" font-family="sans-serif" font-size="11" fill="#0C447C">Sekundær hos partner</text>

<rect x="230" y="140" width="130" height="120" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="295" y="164" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#4A1B0C">Mail</text>
<text x="245" y="192" font-family="sans-serif" font-size="11" fill="#993C1D">Postfix — SMTP</text>
<text x="245" y="212" font-family="sans-serif" font-size="11" fill="#993C1D">Dovecot — IMAP</text>
<text x="245" y="232" font-family="sans-serif" font-size="11" fill="#993C1D">Fuld data-kontrol</text>

<rect x="380" y="140" width="130" height="120" rx="10" fill="#FBEAF0" stroke="#D4537E" stroke-width="1"/>
<text x="445" y="164" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#4B1528">Web</text>
<text x="395" y="192" font-family="sans-serif" font-size="11" fill="#993556">NGINX proxy</text>
<text x="395" y="212" font-family="sans-serif" font-size="11" fill="#993556">Kubernetes drift</text>
<text x="395" y="232" font-family="sans-serif" font-size="11" fill="#993556">cheese01 / cheese02</text>

<rect x="530" y="140" width="150" height="120" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="605" y="164" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#04342C">Interne værktøjer</text>
<text x="545" y="192" font-family="sans-serif" font-size="11" fill="#0F6E56">Git · Nextcloud</text>
<text x="545" y="212" font-family="sans-serif" font-size="11" fill="#0F6E56">Wiki.js · PostgreSQL</text>
<text x="545" y="232" font-family="sans-serif" font-size="11" fill="#0F6E56">LibreNMS · NIPAP</text>

<rect x="60" y="300" width="580" height="130" rx="14" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="80" y="326" font-family="sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Fælles for det hele</text>
<text x="80" y="352" font-family="sans-serif" font-size="12" fill="#5F5E5A">Version-kontrolleret og automatiseret — infrastructure as code fra hypervisor til applikationslag</text>
<text x="80" y="376" font-family="sans-serif" font-size="12" fill="#5F5E5A">Self-hosting: vi ejer data, styrer stacken, og er selv på vagt — et bevidst valg</text>
<text x="80" y="400" font-family="sans-serif" font-size="12" fill="#5F5E5A">Guest-OS: Debian (workloads) og OpenBSD (sikkerheds- og netværksvendte tjenester)</text>
</svg>
