<svg width="700" height="380" viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Virtualisering i Zencurity</title>
<desc>Fysisk hardware kører Debian med KVM som hypervisor. Denne hoster gæste-VM'er, opdelt i OpenBSD-gæster (vpn01, cal01, sunny, sakura) og Debian-gæster (cheese01, cheese02 der udgør Kubernetes-klyngen, samt debian01 til LibreNMS).</desc>

<rect x="40" y="30" width="620" height="320" rx="20" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="60" y="58" font-family="sans-serif" font-size="16" font-weight="600" fill="#2C2C2A">Fysisk hardware — gouda01</text>
<text x="60" y="78" font-family="sans-serif" font-size="13" fill="#5F5E5A">Debian + KVM som hypervisor</text>

<rect x="70" y="100" width="270" height="220" rx="12" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
<text x="90" y="128" font-family="sans-serif" font-size="14" font-weight="600" fill="#042C53">OpenBSD-gæster</text>
<text x="90" y="156" font-family="sans-serif" font-size="13" fill="#0C447C">vpn01</text>
<text x="90" y="174" font-family="sans-serif" font-size="12" fill="#185FA5">WireGuard VPN-server</text>
<text x="90" y="200" font-family="sans-serif" font-size="13" fill="#0C447C">cal01.zencurity.com</text>
<text x="90" y="218" font-family="sans-serif" font-size="12" fill="#185FA5">CalDAV (kcaldav + nginx)</text>
<text x="90" y="244" font-family="sans-serif" font-size="13" fill="#0C447C">sunny</text>
<text x="90" y="262" font-family="sans-serif" font-size="12" fill="#185FA5">Postfix mailserver</text>
<text x="90" y="288" font-family="sans-serif" font-size="13" fill="#0C447C">sakura</text>
<text x="90" y="306" font-family="sans-serif" font-size="12" fill="#185FA5">DHCP/NTP til ZTP-provisionering</text>

<rect x="360" y="100" width="270" height="220" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="380" y="128" font-family="sans-serif" font-size="14" font-weight="600" fill="#04342C">Debian-gæster</text>
<text x="380" y="156" font-family="sans-serif" font-size="13" fill="#085041">cheese01 / cheese02</text>
<text x="380" y="174" font-family="sans-serif" font-size="12" fill="#0F6E56">Kubernetes v1.36 + Cilium 1.18.4</text>
<text x="380" y="200" font-family="sans-serif" font-size="13" fill="#085041">debian01</text>
<text x="380" y="218" font-family="sans-serif" font-size="12" fill="#0F6E56">LibreNMS netværksovervågning</text>

<text x="670" y="345" text-anchor="end" font-family="sans-serif" font-size="11" fill="#888780">Guest OS: Debian (workloads) / OpenBSD (sikkerheds- og netværksvendte tjenester)</text>
</svg>
